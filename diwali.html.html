<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diwali Custom Video Generator - MR Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background: #2c2c2c;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 1250px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .control-panel {
            flex: 1;
            min-width: 320px;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-panel h2 {
            color: #ffaa00;
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ddd;
        }

        .form-group select, 
        .form-group input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #3a3a3a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .form-group select:focus, 
        .form-group input:focus {
            border-color: #ffaa00;
        }

        .btn {
            background: linear-gradient(135deg, #ff8800, #ffbb00);
            color: #000;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: opacity 0.2s;
            text-align: center;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        .preview-container {
            width: 360px; 
            height: 640px; 
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid #ffaa00;
            box-shadow: 0 5px 20px rgba(255,170,0,0.3);
            flex-shrink: 0;
        }

        #canvas-scaler {
            width: 1080px;
            height: 1920px;
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(0.3333);
            transform-origin: top left;
            background: #111;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1920px;
            object-fit: cover;
            z-index: 1;
        }

        .photo-frame-area {
            position: absolute;
            overflow: hidden;
            z-index: 2;
            border: 3px dashed rgba(255, 255, 255, 0.7);
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .photo-frame-area:active {
            cursor: grabbing;
        }

        .photo-frame-area img {
            position: absolute;
            user-select: none;
            pointer-events: none;
        }

        .doctor-name-overlay {
            position: absolute;
            z-index: 5;
            width: 1000px;
            left: 40px;
            text-align: center;
            font-size: 48px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px #ffaa00;
            pointer-events: none;
        }

        .instructions {
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.4;
        }

        #statusText {
            font-size: 0.85rem;
            color: #ffaa00;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="control-panel">
        <h2>🪔 Diwali Video Customizer</h2>
        <p class="instructions">Doctor ki photo upload karein, naam likhein, template select karein aur frame ke andar photo ko adjust karke video generate karein.</p>
        
        <div class="form-group">
            <label for="videoSelect">Select Video Template:</label>
            <select id="videoSelect" onchange="updateVideoTemplate()">
                <option value="1">Template 1 (Frame X:377, Y:348)</option>
                <option value="2">Template 2 (Frame X:387, Y:670)</option>
                <option value="3">Template 3 (Frame X:383, Y:80)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="doctorNameInput">Doctor Name:</label>
            <input type="text" id="doctorNameInput" placeholder="e.g. Rajesh Sharma" oninput="updateDoctorName()">
        </div>

        <div class="form-group">
            <label for="doctorPhotoInput">Upload Doctor Photo:</label>
            <input type="file" id="doctorPhotoInput" accept="image/*" onchange="loadDoctorPhoto(event)">
        </div>

        <div class="form-group">
            <label>Photo Zoom & Adjust:</label>
            <input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1" oninput="adjustZoom(this.value)">
        </div>

        <div id="statusText"></div>
        <button id="genBtn" class="btn" onclick="startVideoGeneration()">🚀 Generate & Download Video</button>
    </div>

    <div class="preview-container">
        <div id="canvas-scaler">
            <!-- Direct video src attribute -->
            <video id="bgVideo" class="bg-video" autoplay muted loop playsinline crossorigin="anonymous" src="video1.mp4"></video>

            <div id="photoFrame" class="photo-frame-area">
                <img id="doctorPreviewImg" src="" alt="" style="display:none;">
            </div>

            <div id="nameDisplay" class="doctor-name-overlay" style="top: 1750px;"></div>
        </div>
    </div>
</div>

<canvas id="renderCanvas" width="1080" height="1920" style="display:none;"></canvas>

<script>
    const templates = {
        1: { w: 326, h: 366, x: 377, y: 348, nameY: 1750, videoSrc: 'video1.mp4' },
        2: { w: 326, h: 366, x: 387, y: 670, nameY: 1750, videoSrc: 'video2.mp4' },
        3: { w: 326, h: 366, x: 383, y: 80,  nameY: 1750, videoSrc: 'video3.mp4' }
    };

    let currentZoom = 1;
    let posX = 0;
    let posY = 0;
    let isDragging = false;
    let startX, startY;
    let loadedDoctorImage = null;

    function updateVideoTemplate() {
        const val = document.getElementById('videoSelect').value;
        const cfg = templates[val];
        const frame = document.getElementById('photoFrame');
        const video = document.getElementById('bgVideo');
        const nameDiv = document.getElementById('nameDisplay');

        frame.style.width = cfg.w + 'px';
        frame.style.height = cfg.h + 'px';
        frame.style.left = cfg.x + 'px';
        frame.style.top = cfg.y + 'px';
        nameDiv.style.top = cfg.nameY + 'px';

        video.src = cfg.videoSrc;
        video.play().catch(e => console.log("Play error:", e));
    }

    function updateDoctorName() {
        const nameVal = document.getElementById('doctorNameInput').value.trim();
        document.getElementById('nameDisplay').innerText = nameVal ? `Dr. ${nameVal}` : '';
    }

    function loadDoctorPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('doctorPreviewImg');
                img.src = e.target.result;
                img.style.display = 'block';

                loadedDoctorImage = new Image();
                loadedDoctorImage.src = e.target.result;

                currentZoom = 1;
                posX = 0;
                posY = 0;
                document.getElementById('zoomRange').value = 1;
                updateImageTransform();
            }
            reader.readAsDataURL(file);
        }
    }

    function adjustZoom(val) {
        currentZoom = val;
        updateImageTransform();
    }

    function updateImageTransform() {
        const img = document.getElementById('doctorPreviewImg');
        img.style.transform = `translate(${posX}px, ${posY}px) scale(${currentZoom})`;
    }

    const frame = document.getElementById('photoFrame');
    frame.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - posX;
        startY = e.clientY - posY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        posX = (e.clientX - startX);
        posY = (e.clientY - startY);
        updateImageTransform();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    window.onload = () => {
        updateVideoTemplate();
    };

    async function startVideoGeneration() {
        const video = document.getElementById('bgVideo');
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const genBtn = document.getElementById('genBtn');

        const docName = document.getElementById('doctorNameInput').value.trim();
        if (!docName) {
            alert("Kripya Doctor ka naam enter karein!");
            return;
        }

        genBtn.disabled = true;
        statusText.innerText = "⏳ Preparing video generation...";

        video.currentTime = 0;
        try {
            await video.play();
        } catch (err) {
            alert("Video play nahi ho pa rahi. Kripya video file check karein.");
            genBtn.disabled = false;
            return;
        }

        const stream = canvas.captureStream(30);
        let recorder;
        try {
            recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        } catch (e) {
            recorder = new MediaRecorder(stream);
        }

        let chunks = [];
        recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Diwali_Wishes_${docName.replace(/\s+/g, '_')}.webm`;
            a.click();
            
            statusText.innerText = "✅ Video Generated & Downloaded Successfully!";
            genBtn.disabled = false;
        };

        recorder.start();
        statusText.innerText = "🔴 Recording video... Please wait (approx 5-6 seconds)";

        const templateVal = document.getElementById('videoSelect').value;
        const cfg = templates[templateVal];

        const recordDuration = Math.min(video.duration && !isNaN(video.duration) ? video.duration : 6, 6) * 1000;
        const startTime = Date.now();

        function drawFrame() {
            if (video.paused || video.ended || (Date.now() - startTime) >= recordDuration) {
                if (recorder.state === "recording") {
                    recorder.stop();
                    video.pause();
                }
                return;
            }

            ctx.drawImage(video, 0, 0, 1080, 1920);

            if (loadedDoctorImage) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(cfg.x, cfg.y, cfg.w, cfg.h);
                ctx.clip();

                const imgW = loadedDoctorImage.width * currentZoom;
                const imgH = loadedDoctorImage.height * currentZoom;
                const centerX = cfg.x + (cfg.w / 2) + posX;
                const centerY = cfg.y + (cfg.h / 2) + posY;

                ctx.drawImage(loadedDoctorImage, centerX - (imgW / 2), centerY - (imgH / 2), imgW, imgH);
                ctx.restore();

                ctx.strokeStyle = "rgba(255,255,255,0.8)";
                ctx.lineWidth = 4;
                ctx.strokeRect(cfg.x, cfg.y, cfg.w, cfg.h);
            }

            ctx.save();
            ctx.font = "800 48px 'Segoe UI', sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.shadowColor = "rgba(0,0,0,0.8)";
            ctx.shadowBlur = 10;
            ctx.fillText(`Dr. ${docName}`, 540, cfg.nameY + 40);
            ctx.restore();

            requestAnimationFrame(drawFrame);
        }

        drawFrame();
    }
</script>

</body>
</html>
