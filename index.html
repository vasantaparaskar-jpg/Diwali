<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diwali Digital Diya Greeting</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        diwaliPurpleDark: '#200525',
                        diwaliPurpleMid: '#481250',
                        diwaliPurpleLight: '#6d2378',
                        diwaliGold: '#f59e0b',
                        diwaliGoldLight: '#fde047',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        cinzel: ['Cinzel', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #110214;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(72, 18, 80, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }
        .mobile-frame {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            position: relative;
            background: #2e0935;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            color: white;
        }
        @media (min-width: 640px) {
            .mobile-frame {
                border-radius: 40px;
                box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 12px #2a0831;
            }
        }
        .screen-section {
            display: none;
            flex-grow: 1;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            z-index: 10;
        }
        .screen-section.active {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- Mobile 9:16 Container -->
    <div class="mobile-frame">

        <!-- Top Header -->
        <header class="w-full pt-3 pb-2 px-6 flex justify-between items-center bg-[#2e0935] border-b border-amber-500/20" style="z-index: 30;">
            <div class="flex items-center space-x-2">
                <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center shadow-lg shadow-amber-500/50">
                    <i class="fa-solid fa-fire text-diwaliPurpleDark text-[10px]"></i>
                </div>
                <span class="text-xs font-bold tracking-wider text-yellow-300 font-cinzel">Digital Diya</span>
            </div>
            <div id="step-indicator" class="text-[10px] bg-black/40 px-2.5 py-0.5 rounded-full border border-amber-500/30 text-amber-200">
                <span id="step-text">Step 1 of 4</span>
            </div>
        </header>

        <!-- ==================== SCREEN 1: LOGIN ==================== -->
        <div id="screen-login" class="screen-section active bg-gradient-to-b from-[#2e0935] via-[#481250] to-[#200525]">
            <div class="w-full glass-card rounded-3xl p-6 shadow-2xl">
                <div class="text-center mb-5">
                    <div class="w-14 h-14 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-3 border border-amber-400/40">
                        <i class="fa-solid fa-user-doctor text-2xl text-yellow-300"></i>
                    </div>
                    <h1 class="text-xl font-bold text-yellow-300">Employee Login</h1>
                    <p class="text-[11px] text-amber-200/90 mt-1 italic">"This Diwali, let us light a digital diya"</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-medium text-amber-200/90 mb-1 uppercase">Employee ID</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-amber-400/70 text-xs">
                                <i class="fa-solid fa-id-badge"></i>
                            </span>
                            <input type="text" id="employee-id" value="" placeholder="Enter Employee ID" class="w-full pl-9 pr-3.5 py-2.5 bg-black/40 border border-amber-500/30 rounded-xl text-white text-xs focus:outline-none focus:border-amber-400">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-amber-200/90 mb-1 uppercase">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-amber-400/70 text-xs">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="login-password" value="" placeholder="Enter Password" class="w-full pl-9 pr-3.5 py-2.5 bg-black/40 border border-amber-500/30 rounded-xl text-white text-xs focus:outline-none focus:border-amber-400">
                        </div>
                    </div>

                    <button id="btn-login" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-diwaliPurpleDark font-bold rounded-xl shadow-lg text-xs tracking-wide mt-3 cursor-pointer">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i> Proceed to Greeting
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== SCREEN 2: DOCTOR NAME ENTRY ==================== -->
        <div id="screen-doc-name" class="screen-section bg-gradient-to-b from-[#2e0935] via-[#481250] to-[#200525]">
            <div class="w-full glass-card rounded-3xl p-6 shadow-2xl">
                <div class="text-center mb-5">
                    <div class="w-14 h-14 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-3 border border-amber-400/40">
                        <i class="fa-solid fa-stethoscope text-2xl text-yellow-300"></i>
                    </div>
                    <h1 class="text-xl font-bold text-yellow-300">Enter Doctor Name</h1>
                    <p class="text-[11px] text-amber-200/90 mt-1">Personalize greeting with Doctor's name.</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-medium text-amber-200/90 mb-1 uppercase">Doctor Full Name</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-amber-400/70 text-xs">
                                <i class="fa-solid fa-user-doctor"></i>
                            </span>
                            <input type="text" id="doctor-input-name" placeholder="e.g. Dr. Rajesh Sharma" class="w-full pl-9 pr-3.5 py-3 bg-black/40 border border-amber-500/30 rounded-xl text-white text-sm focus:outline-none focus:border-amber-400 font-medium">
                        </div>
                    </div>

                    <button id="btn-start-video1" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-diwaliPurpleDark font-bold rounded-xl shadow-lg text-xs tracking-wide cursor-pointer flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-play"></i> <span>Start Activity</span>
                    </button>
                    
                    <button id="btn-back-login" class="w-full py-2 text-amber-300/80 text-xs text-center cursor-pointer">
                        Back to Login
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== SCREEN 3: PART 1 VIDEO BACKGROUND ==================== -->
        <div id="screen-part1" class="screen-section p-0 relative">
            <video id="video-part1" class="absolute inset-0 w-full h-full object-cover" style="z-index: 1;" playsinline muted>
                <source src="Part 1.mp4" type="video/mp4">
            </video>
            <div class="absolute inset-0 bg-black/15" style="z-index: 2;"></div>

            <!-- Light a Diya Button -->
            <div class="absolute inset-x-0 flex justify-center items-center" style="z-index: 20; top: 62%;">
                <button id="btn-light-diya" class="w-[85%] max-w-[320px] py-4 bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 text-diwaliPurpleDark font-bold rounded-full shadow-2xl text-sm tracking-wide border-2 border-yellow-200 animate-pulse cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-fire text-base"></i>
                    <span>Light a diya</span>
                </button>
            </div>
        </div>

        <!-- ==================== SCREEN 4: PART 2 VIDEO BACKGROUND & DOCTOR NAME ==================== -->
        <div id="screen-part2" class="screen-section p-0 relative">
            <!-- Background Video Part 2 -->
            <video id="video-part2" class="absolute inset-0 w-full h-full object-cover" style="z-index: 1;" playsinline autoplay loop>
                <source src="Part 2.mp4" type="video/mp4">
            </video>
            <div class="absolute inset-0 bg-black/10" style="z-index: 2;"></div>

            <!-- Doctor Name Box -->
            <div class="absolute z-20 flex items-center px-3 py-1.5" 
                 style="width: 80%; height: 55px; left: 50%; top: 28%; transform: translateX(-50%);">
                <div class="w-full flex items-center space-x-2.5 truncate">
                    <span class="text-sm sm:text-base text-white font-medium whitespace-nowrap drop-shadow-md">Dear Dr.,</span>
                    <h2 id="display-doc-name" class="text-base sm:text-lg font-bold text-white font-cinzel tracking-wide truncate drop-shadow-md">DR. VASANTA</h2>
                </div>
            </div>

            <!-- Bottom Action Buttons: Download & Share -->
            <div class="absolute bottom-6 inset-x-4 grid grid-cols-2 gap-3" style="z-index: 20;">
                <button id="btn-download" class="py-3 px-3 bg-gradient-to-r from-amber-500 to-orange-500 text-diwaliPurpleDark font-bold rounded-xl text-xs cursor-pointer shadow-lg flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-download"></i> <span>Download</span>
                </button>
                <button id="btn-share" class="py-3 px-3 bg-black/70 border border-amber-400/60 text-yellow-300 font-bold rounded-xl text-xs cursor-pointer shadow-lg flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-share-nodes"></i> <span>Share Card</span>
                </button>
            </div>
        </div>

        <!-- Popup Modal -->
        <div id="custom-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-5 hidden">
            <div class="glass-card rounded-2xl p-6 max-w-xs w-full text-center border border-amber-400/50 shadow-2xl">
                <div class="w-12 h-12 bg-amber-500/20 rounded-full flex items-center justify-center mx-auto mb-3 text-amber-300 text-xl">
                    <i class="fa-solid fa-fire"></i>
                </div>
                <h3 id="modal-title" class="text-base font-bold text-yellow-300 mb-1.5">Notification</h3>
                <p id="modal-message" class="text-xs text-amber-100/90 mb-4">Message content.</p>
                <button id="modal-close" class="w-full py-2 bg-gradient-to-r from-amber-500 to-orange-500 text-diwaliPurpleDark font-bold rounded-xl text-xs cursor-pointer">
                    OK
                </button>
            </div>
        </div>

    </div>

    <!-- JavaScript Application Controller -->
    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            const stepText = document.getElementById('step-text');
            if (screenId === 'screen-login') stepText.innerText = 'Step 1 of 4';
            else if (screenId === 'screen-doc-name') stepText.innerText = 'Step 2 of 4';
            else if (screenId === 'screen-part1') stepText.innerText = 'Step 3 of 4';
            else if (screenId === 'screen-part2') stepText.innerText = 'Step 4 of 4';
        }

        document.getElementById('btn-login').addEventListener('click', function() {
            showScreen('screen-doc-name');
        });

        document.getElementById('btn-back-login').addEventListener('click', function() {
            showScreen('screen-login');
        });

        document.getElementById('btn-start-video1').addEventListener('click', function() {
            const docNameInput = document.getElementById('doctor-input-name').value.trim();
            const docName = docNameInput !== "" ? docNameInput : "DR. VASANTA";

            const formattedName = docName.toUpperCase();
            document.getElementById('display-doc-name').innerText = formattedName;
            
            showScreen('screen-part1');
            const v1 = document.getElementById('video-part1');
            if (v1) {
                v1.currentTime = 0;
                v1.play().catch(e => console.log("Video 1 error:", e));
            }
        });

        document.getElementById('btn-light-diya').addEventListener('click', function() {
            showScreen('screen-part2');
            const v2 = document.getElementById('video-part2');
            if (v2) {
                v2.currentTime = 0;
                v2.play().catch(e => console.log("Video 2 error:", e));
            }
        });

        // Robust download & share function with direct file fallback
        function handleDownloadAction(isShare = false) {
            const docName = document.getElementById('display-doc-name').innerText;
            
            // Try generating canvas image, fallback to direct image download if CORS blocks it
            const img = new Image();
            img.src = "Digital Diya Greeting.jpg";
            
            img.onload = function() {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || 800;
                    canvas.height = img.naturalHeight || 1422;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    // Draw text on canvas
                    const docNameText = "Dear Dr., " + docName;
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 36px 'Poppins', sans-serif";
                    ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
                    ctx.shadowBlur = 10;
                    ctx.fillText(docNameText, canvas.width * 0.1, canvas.height * 0.28);

                    canvas.toBlob(function(blob) {
                        processBlobResult(blob, isShare);
                    }, 'image/jpeg', 0.95);
                } catch (err) {
                    fallbackDirectDownload(isShare);
                }
            };

            img.onerror = function() {
                fallbackDirectDownload(isShare);
            };
        }

        function processBlobResult(blob, isShare) {
            const file = new File([blob], "Digital-Diya-Greeting.png", { type: "image/png" });
            if (isShare && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    title: 'Digital Diya Diwali Greeting',
                    text: 'Happy Diwali! Check out this personalized greeting card[cite: 13].',
                    files: [file]
                }).catch(() => {});
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Digital-Diya-Greeting.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                openModal(isShare ? "Card Ready! 📋" : "Download Successful! 📥", isShare ? "Aapke device par image download ho gayi hai[cite: 13]." : "Aapka greeting card download ho gaya hai[cite: 13].");
            }
        }

        function fallbackDirectDownload(isShare) {
            const a = document.createElement('a');
            a.href = "Digital Diya Greeting.png";
            a.download = 'Digital-Diya-Greeting.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            openModal("Download Successful! 📥", "Aapka greeting card download ho gaya hai[cite: 13].");
        }

        document.getElementById('btn-download').addEventListener('click', function() {
            handleDownloadAction(false);
        });

        document.getElementById('btn-share').addEventListener('click', function() {
            handleDownloadAction(true);
        });

        function openModal(title, msg) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        document.getElementById('modal-close').addEventListener('click', function() {
            document.getElementById('custom-modal').classList.add('hidden');
        });
    </script>
</body>
</html>
